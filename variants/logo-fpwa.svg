<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f9e5f"/>
      <stop offset="1" stop-color="#14522c"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>

  <!-- 工厂（放大并居中，无齿轮） -->
  <g transform="translate(20,-108) scale(1.2)">
    <!-- 烟囱 -->
    <rect x="118" y="148" width="30" height="76" rx="4" fill="#ffffff" opacity="0.92"/>
    <!-- 厂房：锯齿屋顶 -->
    <path d="M96 344 V232 L163 186 V228 L230 186 V228 L297 186 V344 Z" fill="#ffffff"/>
    <!-- 门 -->
    <rect x="243" y="284" width="34" height="60" rx="3" fill="#14522c"/>
    <!-- 高窗 -->
    <rect x="120" y="248" width="26" height="22" rx="3" fill="#14522c" opacity="0.85"/>
    <rect x="187" y="248" width="26" height="22" rx="3" fill="#14522c" opacity="0.85"/>
    <rect x="254" y="248" width="26" height="22" rx="3" fill="#14522c" opacity="0.85"/>
    <rect x="120" y="290" width="26" height="22" rx="3" fill="#14522c" opacity="0.85"/>
    <rect x="187" y="290" width="26" height="22" rx="3" fill="#14522c" opacity="0.85"/>
    <!-- 地基线 -->
    <rect x="86" y="344" width="221" height="12" rx="4" fill="#ffffff" opacity="0.55"/>
  </g>

  <!-- 品牌文字 -->
  <text x="256" y="412" text-anchor="middle"
        font-family="-apple-system,Helvetica,Arial,sans-serif"
        font-size="92" font-weight="800" letter-spacing="2" fill="#ffffff">F-PWA</text>
</svg>
